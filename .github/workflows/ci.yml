name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      SWARM_COMMIT: "${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and regression tests
        run: |
          python -m pip install -e '.[dev]'
          pytest
      - name: Docker Compose all-method smoke study
        run: |
          SWARM_UID=$(id -u) SWARM_GID=$(id -g) docker compose run --rm experiment run --suite /app/scenarios/smoke.yaml
          python scripts/validate_results.py results
      - name: Upload complete smoke reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      SWARM_COMMIT: "${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install result verifier
        run: python -m pip install -e '.[dev]'
      - name: Docker Compose 10,000-identity integrity study
        run: |
          SWARM_UID=$(id -u) SWARM_GID=$(id -g) docker compose run --rm experiment run --suite /app/scenarios/scale-ci.yaml
          python scripts/validate_results.py results
      - name: Upload capacity reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-results
          path: results/
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
