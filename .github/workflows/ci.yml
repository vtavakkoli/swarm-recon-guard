name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest
      - name: Docker Compose smoke test
        run: |
          SWARM_UID=$(id -u) SWARM_GID=$(id -g) docker compose run --rm experiment run --suite /app/scenarios/smoke.yaml
          test -n "$(find results -name report.html -print -quit)"
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
