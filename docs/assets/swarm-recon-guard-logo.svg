<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">SwarmReconGuard logo</title>
  <desc id="desc">A shield containing coordinated swarm nodes and a radar arc, beside the SwarmReconGuard wordmark.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b5c74"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="960" height="260" rx="32" fill="#ffffff"/>

  <g transform="translate(34 20)" filter="url(#shadow)">
    <path d="M110 8 202 40v68c0 61-39 105-92 126C57 213 18 169 18 108V40L110 8Z" fill="url(#shield)"/>
    <path d="M110 26 184 51v55c0 49-30 85-74 105-44-20-74-56-74-105V51l74-25Z" fill="none" stroke="#cbd5e1" stroke-opacity=".35" stroke-width="3"/>

    <g stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-opacity=".9">
      <path d="M70 121 102 87"/>
      <path d="M102 87 143 103"/>
      <path d="M102 87 118 141"/>
      <path d="M70 121 118 141"/>
      <path d="M118 141 154 154"/>
      <path d="M143 103 154 154"/>
    </g>

    <g fill="#f8fafc" stroke="#38bdf8" stroke-width="4">
      <circle cx="70" cy="121" r="10"/>
      <circle cx="102" cy="87" r="11"/>
      <circle cx="143" cy="103" r="10"/>
      <circle cx="118" cy="141" r="11"/>
      <circle cx="154" cy="154" r="10"/>
    </g>

    <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <path d="M55 76c25-31 71-43 108-23"/>
      <path d="M44 57c37-45 101-61 151-31"/>
    </g>

    <path d="M53 178c23 16 51 25 82 23" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(270 70)">
    <text x="0" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="750" fill="#0f172a">
      SwarmRecon<tspan fill="#0b5c74">Guard</tspan>
    </text>
    <text x="2" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#475569">
      Collective reconnaissance detection for hidden agent swarms
    </text>
    <g transform="translate(2 108)">
      <rect x="0" y="0" width="510" height="3" rx="2" fill="url(#accent)"/>
      <text x="0" y="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">
        Black-box · Docker-isolated · Reproducible · Distribution-aware
      </text>
    </g>
  </g>
</svg>