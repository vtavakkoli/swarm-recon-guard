name: smoke
description: Minimal end-to-end CI validation.
agent_counts: [10, 30]
scenarios: [benign_flash, independent_recon, coordinated_swarm]
repeats: 3
requests_per_agent: 3
concurrency: 32
arrival_window_ms: 50
seed: 20261005
baseline_identity_request_limit: 20
detector:
  threshold: 0.72
  min_events: 20
  consecutive_windows: 2
  evaluation_interval: 20
statistical:
  enabled: true
  alpha: 0.01
  shrinkage: 0.10
  hybrid_weight: 0.50
  validation_modes: [leave_repeat_out, leave_scale_out]
