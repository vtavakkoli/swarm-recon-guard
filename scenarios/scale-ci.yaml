name: scale-ci
description: Capacity/integrity regression for a mixed stream with 10,000 identities; not a publication estimate.
agent_counts: [10000]
scenarios: [benign_flash, mixed_swarm]
repeats: 1
requests_per_agent: 3
concurrency: 256
arrival_window_ms: 100
seed: 20261005
attacker_fraction: 0.20
strict_telemetry: true
telemetry_drain_timeout_s: 180
save_event_traces: true
detector: {threshold: 0.72, min_events: 10, consecutive_windows: 2, evaluation_interval: 300}
online: {enabled: true, window_events: 128, window_seconds: 1.0, min_window_events: 8, rff_dimensions: 32, mmd_history: 4}
calibration:
  source: policy
  agent_counts: [10, 100, 1000, 10000]
  training_repeats: 1
  streams: 19
  alpha: 0.10
statistical: {enabled: false}
